version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ethioclass_backend
    restart: always
    env_file:
      - ./backend/.env
    # Port 8080 is NOT exposed publicly — only accessible within Docker network
    # To test internally: docker compose exec backend wget -qO- http://localhost:8080/health
    networks:
      - ethioclass_network

  nginx:
    image: nginx:alpine
    container_name: ethioclass_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Origin TLS certificates — must exist on VPS at /etc/nginx/ssl/
      # Generate from Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
      # Place files at: /etc/nginx/ssl/cloudflare-origin.crt and .key
      # Then mount with: -v /etc/nginx/ssl:/etc/nginx/ssl:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - ethioclass_network

networks:
  ethioclass_network:
    driver: bridge
