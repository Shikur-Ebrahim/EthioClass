version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ethioclass_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - ethioclass_network

  nginx:
    image: nginx:latest
    container_name: ethioclass_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Volumes for SSL certificates (Cloudflare Origin certs or Certbot)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - ethioclass_network

networks:
  ethioclass_network:
    driver: bridge
