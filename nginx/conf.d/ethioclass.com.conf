server {
    listen 80;
    server_name ethioclass.com www.ethioclass.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ethioclass.com www.ethioclass.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Main site — placeholder until Flutter web is deployed
    location / {
        return 200 'EthioClass is coming soon.';
        add_header Content-Type text/plain;
    }
}

# ─────────────────────────────────────────────
# api.ethioclass.com — Go backend
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name api.ethioclass.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.ethioclass.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve static assets (e.g. app logo for email templates)
    location /static/ {
        alias /etc/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to the Go backend container (internal Docker network)
    location / {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
