name: ethioclass
description: "EthioClass - Learn Smarter, Achieve More"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  app_links: ^6.4.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  device_info_plus: ^12.4.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  http_parser: ^4.1.2
  mime: ^2.0.0
  file_picker: ^8.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48